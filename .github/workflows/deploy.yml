name: Build and deploy

on:
  push:
    tags:
      - 'release-*'
  workflow_dispatch:
    inputs:
      ref:
        description: '빌드·배포할 브랜치, 태그 또는 커밋 SHA'
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: toolkitly-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and deploy on M2
    runs-on: [self-hosted, bongbong-MacBookPro-M2]
    timeout-minutes: 30
    env:
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
      GA4_MEASUREMENT_ID: ${{ vars.GA4_MEASUREMENT_ID }}
      ADSENSE_CLIENT_ID: ${{ vars.ADSENSE_CLIENT_ID }}
      GOOGLE_CONSENT_REQUIRED: ${{ vars.GOOGLE_CONSENT_REQUIRED }}
      DEPLOY_ROOT: ${{ vars.TOOLKITLY_DEPLOY_ROOT }}
      SERVICE_PORT: '34561'
      SERVICE_HOST: 0.0.0.0
      LAUNCHD_LABEL: com.bongworks.toolkitly

    steps:
      - name: Check out the selected source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Require release tag format
        if: github.event_name == 'push'
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^release-[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use release-X.Y.Z (received: $GITHUB_REF_NAME)." >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Write public build configuration from GitHub Variables
        run: |
          umask 077
          printf 'PUBLIC_SITE_URL=%s\n' "$PUBLIC_SITE_URL" > .env
          printf 'GA4_MEASUREMENT_ID=%s\n' "$GA4_MEASUREMENT_ID" >> .env
          printf 'ADSENSE_CLIENT_ID=%s\n' "$ADSENSE_CLIENT_ID" >> .env
          printf 'GOOGLE_CONSENT_REQUIRED=%s\n' "$GOOGLE_CONSENT_REQUIRED" >> .env

      - name: Validate deployment configuration
        run: |
          [[ -n "$DEPLOY_ROOT" ]] || { echo 'TOOLKITLY_DEPLOY_ROOT GitHub Variable is required.' >&2; exit 1; }
          [[ "$DEPLOY_ROOT" = /* ]] || { echo 'TOOLKITLY_DEPLOY_ROOT must be an absolute path.' >&2; exit 1; }

      - name: Run unit quality gates
        run: npm test

      - name: Build the release artifact
        run: npm run build

      - name: Prepare release metadata
        id: release
        run: |
          if [[ "$GITHUB_EVENT_NAME" == 'push' ]]; then
            release_name="$GITHUB_REF_NAME-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          else
            release_name="manual-${GITHUB_SHA:0:12}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          fi
          echo "name=$release_name" >> "$GITHUB_OUTPUT"

      - name: Atomically deploy and restart launchd
        env:
          RELEASE_NAME: ${{ steps.release.outputs.name }}
        run: deploy/deploy-on-runner.sh "$GITHUB_WORKSPACE/dist"

  create-github-release:
    name: Publish GitHub Release
    needs: build-and-deploy
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/release-')
    runs-on: [self-hosted, bongbong-MacBookPro-M2]
    permissions:
      contents: write

    steps:
      - name: Create release from tag
        uses: actions/github-script@v7
        env:
          TAG_NAME: ${{ github.ref_name }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = process.env.TAG_NAME;

            try {
              const existing = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });

              if (existing.data.draft) {
                await github.rest.repos.updateRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: existing.data.id,
                  draft: false,
                });
              }

              core.info(`Release already exists for ${tag}.`);
            } catch (error) {
              if (error.status !== 404) throw error;

              await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: tag,
                generate_release_notes: true,
              });
            }
